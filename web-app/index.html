<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TimeTableAlarm</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>TimeTableAlarm</h1>
        <p id="nextClassText">오늘 시간표를 확인하는 중</p>
      </div>
      <button id="notifyButton" class="primary">알림 켜기</button>
    </header>

    <nav class="tabs" aria-label="화면 선택">
      <button class="tab active" data-tab="today">오늘</button>
      <button class="tab" data-tab="schedule">시간표</button>
      <button class="tab" data-tab="periods">수업시간</button>
      <button class="tab" data-tab="import">사진 인식</button>
      <button class="tab" data-tab="settings">설정</button>
    </nav>

    <section id="today" class="panel active">
      <div class="section-title">
        <h2>오늘 남은 수업</h2>
      </div>
      <div id="todayList" class="list"></div>
    </section>

    <section id="schedule" class="panel">
      <div class="section-title">
        <h2>요일별 시간표</h2>
        <button id="addEntryButton" class="icon-button" title="수업 추가">+</button>
      </div>
      <div class="weekday-tabs" id="weekdayTabs"></div>
      <div id="scheduleList" class="list"></div>
    </section>

    <section id="periods" class="panel">
      <div class="section-title">
        <h2>수업시간 빠른 설정</h2>
      </div>

      <div class="quick-setup">
        <button id="firstStartButton" class="time-button" type="button">08:20</button>
        <label>
          수업 시간
          <input id="classLength" type="number" min="10" max="120" step="5" value="50">
        </label>
        <label>
          쉬는시간
          <input id="breakLength" type="number" min="0" max="60" step="5" value="10">
        </label>
        <label>
          점심 후 시작
          <button id="afterLunchStartButton" class="time-button" type="button">13:10</button>
        </label>
        <label>
          교시 수
          <input id="periodCount" type="number" min="1" max="12" step="1" value="7">
        </label>
        <button id="applyQuickSetupButton" class="primary" type="button">자동 생성</button>
      </div>

      <p class="hint">기본은 수업 50분, 쉬는시간 10분입니다. 쉬는시간이 5분 지났을 때 다음 과목을 알려주므로, 다음 수업 시작 5분 전에 알림이 울립니다. 4교시 이후에는 점심시간 60분을 넣고 5교시는 13:10부터 시작합니다.</p>
      <div id="periodList" class="list"></div>
    </section>

    <section id="import" class="panel">
      <div class="section-title">
        <h2>시간표 사진 인식</h2>
      </div>

      <div class="import-box">
        <label>
          시간표 사진
          <input id="imageInput" type="file" accept="image/*" capture="environment">
        </label>
        <img id="imagePreview" alt="선택한 시간표 사진" hidden>
        <button id="runOcrButton" class="primary" type="button">사진에서 글자 읽기</button>
        <p id="ocrStatus" class="status-text">사진 인식은 인터넷 연결이 있을 때 브라우저 OCR로 실행됩니다.</p>

        <label for="importText">인식된 텍스트 또는 직접 붙여넣기</label>
        <textarea id="importText" rows="9" placeholder="예: 월 1교시 수학&#10;월 2교시 영어&#10;화 09:00 과학"></textarea>
        <button id="parseImportButton" class="primary" type="button">후보 만들기</button>
      </div>
      <div id="importCandidates" class="list"></div>
    </section>

    <section id="settings" class="panel">
      <div class="section-title">
        <h2>알림 설정</h2>
      </div>
      <div class="setting-row">
        <label for="leadMinutes">쉬는시간 후 알림</label>
        <input id="leadMinutes" type="number" min="1" max="60" step="1">
        <span>분 지난 뒤</span>
      </div>
      <div class="setting-row">
        <label for="notificationsEnabled">알림 사용</label>
        <input id="notificationsEnabled" type="checkbox">
      </div>
      <p id="notificationStatus" class="status-text"></p>
    </section>
  </main>

  <dialog id="entryDialog">
    <form method="dialog" id="entryForm" class="dialog-form">
      <h2 id="entryDialogTitle">수업 추가</h2>
      <input type="hidden" id="entryId">

      <label>
        과목명
        <input id="subjectName" required autocomplete="off">
      </label>

      <label>
        요일
        <select id="entryWeekday"></select>
      </label>

      <label>
        시간 방식
        <select id="entryTimeMode">
          <option value="period">교시</option>
          <option value="custom">직접 시간</option>
        </select>
      </label>

      <label id="periodSelectRow">
        교시
        <select id="entryPeriod"></select>
      </label>

      <div id="customTimeRow" class="time-grid">
        <label>
          시작
          <button id="customStartButton" class="time-button" type="button">09:00</button>
        </label>
        <label>
          종료
          <button id="customEndButton" class="time-button" type="button">09:50</button>
        </label>
      </div>

      <div class="dialog-actions">
        <button type="button" id="deleteEntryButton" class="danger">삭제</button>
        <span></span>
        <button type="button" id="cancelEntryButton">취소</button>
        <button class="primary" value="default">저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="timeDialog">
    <form method="dialog" class="dialog-form">
      <h2>시간 설정</h2>
      <div class="time-display" id="timeDialDisplay">09:00</div>
      <label>
        시
        <input id="dialHour" type="range" min="0" max="23" step="1">
      </label>
      <label>
        분
        <input id="dialMinute" type="range" min="0" max="59" step="5">
      </label>
      <div class="dial-actions">
        <button type="button" class="quick-time" data-time="08:20">08:20</button>
        <button type="button" class="quick-time" data-time="08:30">08:30</button>
        <button type="button" class="quick-time" data-time="09:00">09:00</button>
        <button type="button" class="quick-time" data-time="13:00">13:00</button>
      </div>
      <div class="dialog-actions two">
        <button type="button" id="cancelTimeButton">취소</button>
        <button type="button" id="saveTimeButton" class="primary">적용</button>
      </div>
    </form>
  </dialog>
</body>
</html>
